<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" font-family="Segoe UI, DM Sans, sans-serif">
  <defs>
    <marker id="pijl" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <marker id="pijlgroen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#39ff14"/>
    </marker>
  </defs>

  <rect width="1280" height="760" fill="#0b1220"/>
  <text x="40" y="52" fill="#39ff14" font-size="26" font-weight="700">GeoInzicht — architectuur</text>
  <text x="40" y="76" fill="#94a3b8" font-size="13">DWH op laptop, alleen de presentatielaag naar de cloud · vastgelegd 02-08-2026</text>

  <!-- ===== KOLOM 1: BRONNEN ===== -->
  <rect x="40" y="110" width="270" height="430" rx="14" fill="#111a2e" stroke="#334155"/>
  <text x="60" y="140" fill="#f59e0b" font-size="15" font-weight="700">BRONNEN</text>
  <text x="60" y="158" fill="#94a3b8" font-size="10">catalogus: developer.overheid.nl</text>
  <g font-size="12" fill="#e2e8f0">
    <rect x="60" y="172" width="230" height="30" rx="6" fill="#0b1220" stroke="#475569"/><text x="72" y="192">BAG / PDOK (Kadaster)</text>
    <rect x="60" y="208" width="230" height="30" rx="6" fill="#0b1220" stroke="#475569"/><text x="72" y="228">CBS OData (buurten/wijken)</text>
    <rect x="60" y="244" width="230" height="30" rx="6" fill="#0b1220" stroke="#475569"/><text x="72" y="264">Politie · RIVM · GBIF · Vektis</text>
    <rect x="60" y="280" width="230" height="30" rx="6" fill="#0b1220" stroke="#475569"/><text x="72" y="300">Bekendmakingen (SRU/KOOP)</text>
    <rect x="60" y="316" width="230" height="30" rx="6" fill="#0b1220" stroke="#475569"/><text x="72" y="336">BAG IB v2 (levenscyclus, key)</text>
    <rect x="60" y="352" width="230" height="30" rx="6" fill="#0b1220" stroke="#475569"/><text x="72" y="372">KvK / Northdata / scrapers</text>
  </g>
  <text x="60" y="415" fill="#64748b" font-size="10">Open API's, gedocumenteerd op</text>
  <text x="60" y="429" fill="#64748b" font-size="10">developer.overheid.nl · links in catalog.json</text>

  <!-- ===== KOLOM 2: LAPTOP DWH ===== -->
  <rect x="370" y="110" width="330" height="540" rx="14" fill="#101c33" stroke="#38bdf8"/>
  <text x="390" y="140" fill="#38bdf8" font-size="15" font-weight="700">LAPTOP — SQL SERVER DWH</text>
  <text x="390" y="158" fill="#94a3b8" font-size="10">beheer lokaal · SQL Server Agent jobs</text>

  <rect x="390" y="175" width="290" height="70" rx="8" fill="#0b1220" stroke="#475569"/>
  <text x="405" y="197" fill="#e2e8f0" font-size="13" font-weight="700">stg — bronlaag</text>
  <text x="405" y="215" fill="#94a3b8" font-size="10">ruwe API-data, Python ETL-scripts</text>
  <text x="405" y="229" fill="#94a3b8" font-size="10">(build_geojson, enrich_*, scrapers)</text>

  <rect x="390" y="265" width="290" height="70" rx="8" fill="#0b1220" stroke="#475569"/>
  <text x="405" y="287" fill="#e2e8f0" font-size="13" font-weight="700">int — integratielaag (Inmon, relationeel 3NF)</text>
  <text x="405" y="303" fill="#94a3b8" font-size="10">bronnen geïntegreerd op business keys</text>
  <text x="405" y="316" fill="#94a3b8" font-size="10">(BAG-id, buurtcode, KvK-nr, datum) + historie</text>
  <text x="405" y="329" fill="#94a3b8" font-size="10">ontdubbeling · bijgewerkt door SQL Agent jobs</text>

  <rect x="390" y="355" width="290" height="120" rx="8" fill="#0d2415" stroke="#39ff14"/>
  <text x="405" y="377" fill="#39ff14" font-size="13" font-weight="700">mart — presentatielaag (Kimball)</text>
  <text x="405" y="396" fill="#e2e8f0" font-size="10">dim_buurt · dim_wijk · dim_gemeente</text>
  <text x="405" y="411" fill="#e2e8f0" font-size="10">dim_datum · dim_gebruiksdoel</text>
  <text x="405" y="426" fill="#e2e8f0" font-size="10">fact_bag_status · fact_criminaliteit · fact_woz</text>
  <text x="405" y="445" fill="#94a3b8" font-size="10">voorgejoind + voorgeaggregeerd = performance</text>
  <text x="405" y="459" fill="#94a3b8" font-size="10">ALLEEN deze laag gaat naar de cloud</text>

  <rect x="390" y="495" width="290" height="60" rx="8" fill="#0b1220" stroke="#a78bfa"/>
  <text x="405" y="512" fill="#a78bfa" font-size="12" font-weight="700">INFORMATIEMODEL — docs/informatiemodel/ (git)</text>
  <text x="405" y="528" fill="#e2e8f0" font-size="10">int: relationeel model 3NF (Inmon) — Mermaid-ERD</text>
  <text x="405" y="541" fill="#e2e8f0" font-size="10">mart: sterschema's (Kimball) + bron-mapping</text>
  <text x="405" y="553" fill="#94a3b8" font-size="9">wijzigen = commit op develop · later dbt (docs + lineage)</text>

  <rect x="390" y="570" width="290" height="55" rx="8" fill="#0b1220" stroke="#475569"/>
  <text x="405" y="592" fill="#e2e8f0" font-size="12" font-weight="700">serve.py (lokaal, poort 8091)</text>
  <text x="405" y="609" fill="#94a3b8" font-size="10">/api/bag/lvc · /api/bekendmakingen · refresh</text>

  <!-- pijlen binnen laptop -->
  <line x1="535" y1="245" x2="535" y2="263" stroke="#94a3b8" stroke-width="2" marker-end="url(#pijl)"/>
  <line x1="535" y1="335" x2="535" y2="353" stroke="#94a3b8" stroke-width="2" marker-end="url(#pijl)"/>

  <!-- bronnen -> stg -->
  <line x1="310" y1="210" x2="388" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#pijl)"/>
  <text x="316" y="200" fill="#64748b" font-size="9">ETL (laptop aan)</text>

  <!-- ===== KOLOM 3: CLOUD ===== -->
  <rect x="760" y="110" width="480" height="330" rx="14" fill="#111a2e" stroke="#a78bfa"/>
  <text x="780" y="140" fill="#a78bfa" font-size="15" font-weight="700">CLOUD — altijd aan (laptop uit = app blijft werken)</text>

  <rect x="780" y="160" width="210" height="120" rx="8" fill="#0d2415" stroke="#39ff14"/>
  <text x="795" y="182" fill="#39ff14" font-size="13" font-weight="700">Supabase (Postgres)</text>
  <text x="795" y="201" fill="#e2e8f0" font-size="10">spiegel van het mart-schema</text>
  <text x="795" y="216" fill="#e2e8f0" font-size="10">REST API (read-only key, RLS)</text>
  <text x="795" y="231" fill="#e2e8f0" font-size="10">PostGIS voor geometrie</text>
  <text x="795" y="250" fill="#94a3b8" font-size="10">+ Edge Functions: bag/lvc,</text>
  <text x="795" y="264" fill="#94a3b8" font-size="10">bekendmakingen (voor Pages-versie)</text>

  <rect x="1010" y="160" width="210" height="120" rx="8" fill="#0b1220" stroke="#475569"/>
  <text x="1025" y="182" fill="#e2e8f0" font-size="13" font-weight="700">GitHub</text>
  <text x="1025" y="201" fill="#94a3b8" font-size="10">repo: code + informatiemodel</text>
  <text x="1025" y="216" fill="#94a3b8" font-size="10">Pages: GeoInzicht frontend</text>
  <text x="1025" y="231" fill="#94a3b8" font-size="10">Actions: geplande refresh van</text>
  <text x="1025" y="245" fill="#94a3b8" font-size="10">publieke bronnen (cron, laptop-vrij)</text>
  <text x="1025" y="264" fill="#94a3b8" font-size="10">develop → main → Pages live</text>

  <rect x="780" y="300" width="440" height="60" rx="8" fill="#0b1220" stroke="#475569"/>
  <text x="795" y="322" fill="#e2e8f0" font-size="12" font-weight="700">GeoInzicht app (anneversion.github.io)</text>
  <text x="795" y="339" fill="#94a3b8" font-size="10">Leaflet · CBS-choropleten · BAG-status + levenscyclus · bekendmakingen-knop</text>
  <text x="795" y="352" fill="#94a3b8" font-size="10">leest marts uit Supabase · valt terug op BAG Viewer-links zonder lokale server</text>

  <rect x="780" y="380" width="440" height="40" rx="8" fill="#0b1220" stroke="#475569"/>
  <text x="795" y="405" fill="#e2e8f0" font-size="12">👤 Gebruiker (browser, overal)</text>

  <!-- mart -> supabase sync -->
  <path d="M 680 415 C 730 415 730 220 778 220" stroke="#39ff14" stroke-width="2.5" fill="none" marker-end="url(#pijlgroen)"/>
  <text x="690" y="330" fill="#39ff14" font-size="10" font-weight="700" transform="rotate(-90 700 330)"></text>
  <text x="712" y="180" fill="#39ff14" font-size="10" font-weight="700"></text>
  <rect x="660" y="430" width="220" height="34" rx="6" fill="#0d2415" stroke="#39ff14"/>
  <text x="672" y="444" fill="#39ff14" font-size="10" font-weight="700">SYNC: alleen mart-schema</text>
  <text x="672" y="457" fill="#94a3b8" font-size="9">laatste stap SQL Agent job, bij laptop aan</text>

  <!-- github actions -> bronnen -->
  <path d="M 1115 282 C 1115 560 320 600 310 400" stroke="#475569" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#pijl)"/>
  <text x="900" y="560" fill="#64748b" font-size="9">Actions: publieke bronnen verversen zonder laptop (gepland)</text>

  <!-- supabase -> app -->
  <line x1="885" y1="280" x2="920" y2="298" stroke="#94a3b8" stroke-width="2" marker-end="url(#pijl)"/>
  <!-- github pages -> app -->
  <line x1="1115" y1="280" x2="1080" y2="298" stroke="#94a3b8" stroke-width="2" marker-end="url(#pijl)"/>
  <!-- app -> gebruiker -->
  <line x1="1000" y1="360" x2="1000" y2="378" stroke="#94a3b8" stroke-width="2" marker-end="url(#pijl)"/>

  <!-- legenda / principes -->
  <rect x="40" y="565" width="270" height="150" rx="10" fill="#111a2e" stroke="#334155"/>
  <text x="56" y="590" fill="#e2e8f0" font-size="12" font-weight="700">Principes</text>
  <text x="56" y="612" fill="#94a3b8" font-size="10">· Ruwe data en integratielaag blijven op de laptop</text>
  <text x="56" y="628" fill="#94a3b8" font-size="10">· Alleen gepubliceerde marts staan online</text>
  <text x="56" y="644" fill="#94a3b8" font-size="10">· API-keys server-side, nooit in het repo</text>
  <text x="56" y="660" fill="#94a3b8" font-size="10">· Informatiemodel als tekst in git (Mermaid)</text>
  <text x="56" y="676" fill="#94a3b8" font-size="10">· developer.overheid.nl = bronnencatalogus</text>
  <text x="56" y="692" fill="#94a3b8" font-size="10">· Laptop aan = sync; laptop uit = cloud draait door</text>
</svg>
